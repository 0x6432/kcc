name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Build and test
        run: make test CC=${{ matrix.compiler }}
      - name: Build pinned QBE and test generated executables
        run: |
          sh scripts/build_qbe.sh "$RUNNER_TEMP/kcc-qbe"
          make test-codegen QBE="$RUNNER_TEMP/kcc-qbe/qbe-1.2/qbe"
      - name: Address and undefined-behavior sanitizers
        run: |
          make clean
          make test CC=${{ matrix.compiler }} CFLAGS='-std=c11 -O1 -g -Wall -Wextra -Wpedantic -Werror -fsanitize=address,undefined -fno-omit-frame-pointer' LDFLAGS='-fsanitize=address,undefined'
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Fuzz the on-demand lexer
        run: |
          seconds=20
          if [ "${{ github.event_name }}" = schedule ]; then
            seconds=180
          fi
          make fuzz-lex FUZZ_SECONDS="$seconds"
          make fuzz-compile FUZZ_SECONDS="$seconds"
      - name: Retain fuzz corpus and failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: compiler-fuzz-artifacts
          path: |
            build/fuzz-artifacts/
            build/corpus-lex/
            build/corpus-compile/
          retention-days: 7
