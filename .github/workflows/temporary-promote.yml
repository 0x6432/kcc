name: Promote atomic BitInt support
on:
  push:
    branches: [wip-promote-aff8503]
permissions:
  contents: write
  actions: write
jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Check exact refs and fast-forward development
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin development:refs/remotes/origin/dev-check
          git fetch origin wip-bitint-abi-atomics-f0d51bc:refs/remotes/origin/wip-check
          test "$(git rev-parse refs/remotes/origin/dev-check)" = "1d2ea134dbfd15268755d859cb7fba0dac74f193"
          test "$(git rev-parse refs/remotes/origin/wip-check)" = "40b06ba7d90c26fce1582f2080e8e8a9f278ca5e"
          git merge-base --is-ancestor refs/remotes/origin/dev-check refs/remotes/origin/wip-check
          git push origin refs/remotes/origin/wip-check:refs/heads/development
          test "$(git ls-remote origin refs/heads/development | cut -f1)" = "40b06ba7d90c26fce1582f2080e8e8a9f278ca5e"
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref development || echo 'Could not dispatch CI; run it manually.'
