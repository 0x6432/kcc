name: Identify failed test recipes
on:
  push:
    branches: [wip-promote-aff8503]
permissions:
  actions: read
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Report only test names and error categories
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for job in 129319998380 129319998260; do
            curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/jobs/$job/logs" > "$RUNNER_TEMP/$job.log"
            JOB="$job" LOG="$RUNNER_TEMP/$job.log" python3 - <<'PY2'
          import os,re
          log=open(os.environ['LOG'],errors='replace').read()
          recipes=re.findall(r'python3 (tests/test_[a-z0-9_]+\.py)',log)
          frames=re.findall(r'File "[^"\n]*/(tests/test_[a-z0-9_]+\.py)", line ([0-9]+)',log)
          flags=[name for name,pattern in [('assertion','AssertionError'),('compiler_error','error:'),('asan','AddressSanitizer'),('ubsan','runtime error:'),('segfault','Segmentation fault'),('subprocess','CalledProcessError')] if re.search(pattern,log)]
          print('::warning title=Failure '+os.environ['JOB']+'::recipe '+(recipes[-1] if recipes else 'none')+'; frames '+(', '.join(f'{f}:{l}' for f,l in frames[-8:]) or 'none')+'; categories '+','.join(flags))
          PY2
          done
