name: Stop redundant temporary-branch CI runs
on:
  push:
    branches: [wip-promote-aff8503]
permissions:
  contents: read
  actions: write
jobs:
  cancel-redundant:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel only the three identified temporary-branch CI runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for pair in '42658709548:wip-transfer-aff8503' '42660279216:wip-promote-aff8503' '42660775426:wip-transfer-04020cb'; do
            id=${pair%%:*}; branch=${pair#*:}
            actual=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id" --jq '.head_branch')
            test "$actual" = "$branch"
            gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$id/cancel" >/dev/null || true
          done
